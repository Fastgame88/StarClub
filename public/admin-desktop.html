<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Club Desktop Admin</title>
  <link rel="stylesheet" href="/admin-desktop.css" />
</head>
<body>
  <div id="login" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand-star">★</div>
      <h1>Star Club Admin</h1>
      <p>ПК-версія адмінки. Telegram-адмінка залишається за адресою <b>/admin</b>.</p>
      <input name="login" placeholder="Логін" autocomplete="username" required>
      <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button>Увійти</button>
      <small>Перший Owner: <b>owner</b> / <b>StarClubOwner2026!</b></small>
    </form>
  </div>
  <div id="shell" class="shell hidden">
    <aside>
      <div class="brand"><span>★</span><b>Star Club</b><small>Desktop Admin</small></div>
      <button data-tab="dashboard" class="active">Аналітика</button>
      <button data-tab="clients">Клієнти</button>
      <button data-tab="stores">Магазини</button>
      <button data-tab="rewards">Товари за зірки</button>
      <button data-tab="offers">Пропозиції</button>
      <button data-tab="challenges">Челенджі</button>
      <button data-tab="stamps">Накопичувальні</button>
      <button data-tab="news">Новини</button>
      <button data-tab="qrs">QR-коди</button>
      <button data-tab="support">Підтримка</button>
      <button data-tab="admins">Адміни</button>
      <button id="logout">Вийти</button>
      <a href="/admin" target="_blank">Мобільна Telegram-адмінка ↗</a>
    </aside>
    <main>
      <header><h1 id="title">Аналітика</h1><div id="adminInfo"></div></header>
      <section id="content"></section>
    </main>
  </div>
  <script type="module" src="/admin-desktop.js"></script>
</body>
</html>
